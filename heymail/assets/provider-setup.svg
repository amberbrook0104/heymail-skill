<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-label="网易 163 / QQ：开通 SMTP 与授权码">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#3568ce"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1b2b44}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#63738a}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#63738a}</style>
<rect width="1120" height="510" rx="22" fill="#f5f8fc"/>
<text x="36" y="53" class="title">网易 163 / QQ：开通 SMTP 与授权码</text>
<text x="36" y="88" class="sub">本人在官方网页完成登录和验证。此图为入口示意，界面以实际版本为准。</text>
<rect x="35" y="125" width="510" height="290" rx="16" fill="white" stroke="#cdd9ec" stroke-width="2"/>
<text x="57" y="163" class="head">网易 163</text>
<text x="57" y="203" class="body">① mail.163.com 登录或注册</text>
<text x="57" y="236" class="body">② 设置 → POP3/SMTP/IMAP</text>
<text x="57" y="269" class="body">③ 开启包含 SMTP 的服务，完成验证</text>
<text x="57" y="302" class="body">④ 新增客户端授权码 → 本机密码框保存</text>
<text x="57" y="335" class="body">smtp.163.com  ·  465  ·  SSL/TLS</text>
<rect x="575" y="125" width="510" height="290" rx="16" fill="white" stroke="#cdd9ec" stroke-width="2"/>
<text x="597" y="163" class="head">QQ 邮箱</text>
<text x="597" y="203" class="body">① mail.qq.com 登录并开通邮箱</text>
<text x="597" y="236" class="body">② 头像 → 设置 → 账号与安全</text>
<text x="597" y="269" class="body">③ 安全设置 → 开启服务 → 生成授权码</text>
<text x="597" y="302" class="body">④ 本人完成验证 → 本机密码框保存</text>
<text x="597" y="335" class="body">smtp.qq.com  ·  465  ·  SSL/TLS</text>
<text x="36" y="466" class="small">授权码不是网页登录密码；不要粘贴到聊天，不上传真实授权码截图。</text>
</svg>