<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-label="授权码怎样安全封装">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#3568ce"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1b2b44}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#63738a}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#63738a}</style>
<rect width="1120" height="510" rx="22" fill="#f5f8fc"/>
<text x="36" y="53" class="title">授权码怎样安全封装</text>
<text x="36" y="88" class="sub">代码可以分享；个人配置、简历和凭据保留在本机。此图为示意。</text>
<rect x="35" y="125" width="320" height="265" rx="16" fill="white" stroke="#cdd9ec" stroke-width="2"/>
<text x="57" y="163" class="head">① 先填授权码</text>
<text x="57" y="203" class="body">类型：网易163 / QQ</text>
<text x="57" y="236" class="body">授权码：●●●●●●●●</text>
<text x="57" y="269" class="body">暂不需要简历或邮箱</text>
<text x="57" y="302" class="body">备用：本机终端隐藏输入</text>
<rect x="400" y="125" width="320" height="265" rx="16" fill="white" stroke="#cdd9ec" stroke-width="2"/>
<text x="422" y="163" class="head">② Windows 凭据管理器</text>
<text x="422" y="203" class="body">随机 pending 目标暂存</text>
<text x="422" y="236" class="body">补齐简历和邮箱后绑定</text>
<text x="422" y="269" class="body">成功后清理暂存凭据</text>
<text x="422" y="302" class="body">JSON 只记录进度与资料</text>
<rect x="765" y="125" width="320" height="265" rx="16" fill="white" stroke="#cdd9ec" stroke-width="2"/>
<text x="787" y="163" class="head">③ 用户确认后发信</text>
<text x="787" y="203" class="body">本机进程内部读取</text>
<text x="787" y="236" class="body">固定 SMTP 主机 + TLS</text>
<text x="787" y="269" class="body">不输出认证调试日志</text>
<text x="787" y="302" class="body">不附加平台自动发送页脚</text>
<path d="M363 250 H390" stroke="#3568ce" stroke-width="3" marker-end="url(#a)"/>
<path d="M728 250 H755" stroke="#3568ce" stroke-width="3" marker-end="url(#a)"/>
<text x="36" y="437" class="small">保护边界：授权码会短暂存在进程内存；同一用户的恶意程序或管理员可能访问凭据。</text>
<text x="36" y="472" class="small">公开仓库不包含真实邮箱配置、简历、草稿、回执或任何授权码。</text>
</svg>